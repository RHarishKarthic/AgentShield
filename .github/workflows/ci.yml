name: AgentShield CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Test Suite & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentshield
          POSTGRES_USER: agentshield
          POSTGRES_PASSWORD: agentshield_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality & Linting (Ruff)
        run: |
          cd backend
          ruff check .

      - name: Run Database Migrations & Seed
        env:
          DATABASE_URL: postgresql+asyncpg://agentshield:agentshield_dev_password@localhost:5432/agentshield
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: agentshield
          POSTGRES_USER: agentshield
          POSTGRES_PASSWORD: agentshield_dev_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          WAF_API_KEY: dev-api-key-agentshield-2026
          PYTHONPATH: .
        run: |
          cd backend
          alembic upgrade head
          python ../scripts/seed_data.py

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://agentshield:agentshield_dev_password@localhost:5432/agentshield
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: agentshield
          POSTGRES_USER: agentshield
          POSTGRES_PASSWORD: agentshield_dev_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          WAF_API_KEY: dev-api-key-agentshield-2026
          PYTHONPATH: .
        run: |
          cd backend
          pytest -v --cov=app --cov-report=term-missing

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Typecheck
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build Production Bundle
        run: |
          cd frontend
          npm run build

  docker-build:
    name: Docker Containers Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build All Docker Services
        run: |
          docker compose build
