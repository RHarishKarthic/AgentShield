services:
  # 1. Backend WAF Gateway Service
  - type: web
    name: agentshield-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: "production"
      - key: DEBUG
        value: "false"
      - key: WAF_MODE
        value: "enforcement"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://agentshield-frontend-lrhq.onrender.com,http://localhost:5173,http://localhost:3000"
      - key: TOOL_CUSTOMER_URL
        value: "https://agentshield-tools.onrender.com"
      - key: TOOL_EMAIL_URL
        value: "https://agentshield-tools.onrender.com"
      - key: TOOL_FILE_URL
        value: "https://agentshield-tools.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: agentshield-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: agentshield-redis
          property: connectionString

  # 2. Downstream Mock Tool Microservices
  - type: web
    name: agentshield-tools
    runtime: docker
    dockerfilePath: tools/Dockerfile
    dockerContext: tools
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8001"

  # 3. Frontend SOC Dashboard
  # API_BASE is injected at runtime by start.sh into /config.js
  # Set this to your actual backend public URL from Render dashboard
  - type: web
    name: agentshield-frontend
    runtime: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    plan: free
    region: oregon
    envVars:
      - key: API_BASE
        value: "https://agentshield-backend-77dp.onrender.com/api/v1"

  # 4. Redis In-Memory Store
  - type: redis
    name: agentshield-redis
    plan: free
    region: oregon
    ipAllowList: []

databases:
  # 5. Managed PostgreSQL Database
  - name: agentshield-postgres
    plan: free
    region: oregon
    databaseName: agentshield
    user: agentshield_user
