services:
  # 1. Backend WAF Gateway Service
  - type: web
    name: agentshield-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: "production"
      - key: DEBUG
        value: "false"
      - key: WAF_MODE
        value: "enforcement"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: TOOL_CUSTOMER_URL
        value: "http://agentshield-tools:8001"
      - key: TOOL_EMAIL_URL
        value: "http://agentshield-tools:8002"
      - key: TOOL_FILE_URL
        value: "http://agentshield-tools:8003"
      - key: DATABASE_URL
        fromDatabase:
          name: agentshield-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: agentshield-redis
          property: connectionString

  # 2. Downstream Mock Tool Microservices
  - type: web
    name: agentshield-tools
    runtime: docker
    dockerfilePath: tools/Dockerfile
    dockerContext: tools
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: "8001"

  # 3. Frontend SOC Dashboard
  - type: web
    name: agentshield-frontend
    runtime: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    plan: free
    region: oregon

  # 4. Redis In-Memory Store
  - type: redis
    name: agentshield-redis
    plan: free
    region: oregon
    ipAllowList: [] # Internal private networking only

databases:
  # 5. Managed PostgreSQL Database
  - name: agentshield-postgres
    plan: free
    region: oregon
    databaseName: agentshield
    user: agentshield_user
