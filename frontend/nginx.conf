server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Health check
    location /nginx-health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # API Proxy to Backend (supports same-origin calls without CORS hurdles)
    location /api/ {
        resolver 8.8.8.8 1.1.1.1 valid=30s ipv6=off;
        proxy_pass https://agentshield-backend-77dp.onrender.com/api/;
        proxy_http_version 1.1;
        proxy_set_header Host agentshield-backend-77dp.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
    }

    # Single Page Application router fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
