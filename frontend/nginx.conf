server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # API Proxy to Backend (Uses resolver to prevent boot failure if backend is still starting)
    location /api/ {
        resolver 127.0.0.11 1.1.1.1 8.8.8.8 valid=30s ipv6=off;
        set $backend_upstream "http://agentshield-backend:8000";
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # WebSocket Proxy to Backend
    location /ws/ {
        resolver 127.0.0.11 1.1.1.1 8.8.8.8 valid=30s ipv6=off;
        set $backend_upstream "http://agentshield-backend:8000";
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Single Page Application router fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
