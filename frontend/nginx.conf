server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Health check
    location /nginx-health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Single Page Application router fallback
    # NOTE: In cloud deployments the frontend calls the backend public URL
    # directly (VITE_API_BASE). The /api/ proxy is only used for local dev.
    location /api/ {
        resolver 8.8.8.8 1.1.1.1 valid=30s ipv6=off;
        proxy_pass http://localhost:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
